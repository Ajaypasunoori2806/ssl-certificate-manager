{% extends "base.html" %}

{% block content %}

<h2>Certificate Inventory</h2>

<br>

<a href="/upload-certificate">
    <button>Upload Signed Certificate</button>
</a>

<br><br>

<table border="1" cellpadding="10" cellspacing="0">

    <tr>
        <th>ID</th>
        <th>Common Name</th>
        <th>Organization</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>

    {% for certificate in certificates %}

    <tr>

        <td>{{ certificate.id }}</td>

        <td>{{ certificate.common_name }}</td>

        <td>{{ certificate.organization }}</td>

        <td>{{ certificate.status }}</td>

        <td>

            <a href="/download/csr/{{ certificate.id }}">
                <button>Download CSR</button>
            </a>

            <a href="/download/key/{{ certificate.id }}">
                <button>Download Key</button>
            </a>

            <a href="/generate-self-signed/{{ certificate.id }}">
                <button>Generate Self-Signed</button>
            </a>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
