{% extends "base.html" %}

{% block content %}

<h2>Upload Signed Certificate</h2>

<form action="/upload-certificate" method="post" enctype="multipart/form-data">

    <label>Certificate Request ID</label><br>
    <input type="number" name="certificate_id" required><br><br>

    <label>Select Certificate (.crt)</label><br>
    <input type="file" name="certificate" accept=".crt" required><br><br>

    <button type="submit">Upload Certificate</button>

</form>

{% endblock %}
