{% extends "base.html" %}

{% block title %}
Upload Certificate
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-upload"></i>
                        Upload Signed Certificate
                    </h4>

                </div>

                <div class="card-body">

                    <form action="/upload-certificate" method="post" enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">
                                Certificate Request ID
                            </label>

                            <input type="number" name="certificate_id" class="form-control"
                                placeholder="Enter Certificate ID" required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Select Certificate (.crt)
                            </label>

                            <input type="file" name="certificate" class="form-control" accept=".crt" required>

                            <div class="form-text">
                                Upload the signed certificate received from your Certificate Authority.
                            </div>

                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-cloud-upload"></i>
                            Upload Certificate
                        </button>

                        <a href="/certificates" class="btn btn-secondary ms-2">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
